# Static GitHub Pages preview of the remote-review approval shell.
# Fork-only: does not run on anomalyco/opencode. Does not publish npm or create a release.
# Enabling Pages (Actions as the source) still needs a one-time repo setting.
name: Deploy review preview

on:
  push:
    branches: [review]
    paths:
      - "packages/review/**"
      - "packages/review-annotator/**"
      - ".github/workflows/deploy-review-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'younglark/opencode'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-bun
      - name: Build static preview
        run: bun packages/review/script/preview-pages.ts
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: packages/review/preview/dist
          include-hidden-files: true

  deploy:
    if: github.repository == 'younglark/opencode'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
